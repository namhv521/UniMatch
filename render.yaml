services:
  - type: web
    name: unimatch-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: UNIMATCH_DEPLOYMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: UNIMATCH_PUBLIC_ORIGIN
        sync: false
      - key: UNIMATCH_MODEL_BUNDLE
        sync: false
      - key: UNIMATCH_MODEL_BUNDLE_SHA256
        sync: false
      - key: UNIMATCH_GOOGLE_CLIENT_ID
        sync: false
      - key: UNIMATCH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: UNIMATCH_GITHUB_CLIENT_ID
        sync: false
      - key: UNIMATCH_GITHUB_CLIENT_SECRET
        sync: false
      - key: UNIMATCH_FACEBOOK_CLIENT_ID
        sync: false
      - key: UNIMATCH_FACEBOOK_CLIENT_SECRET
        sync: false
      - key: UNIMATCH_AUTH_START_RATE_LIMIT
        value: 10
      - key: UNIMATCH_AUTH_START_RATE_WINDOW_SECONDS
        value: 60
