[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kltn-matching"
version = "0.1.0"
description = "RL-based student-advisor matching system for KLTN"
authors = [{name = "AI Agent", email = "agent@kltn.local"}]
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.27.0",
    "stable-baselines3>=2.0.0",
    "sb3-contrib>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "sentence-transformers==5.2.0",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "pyvi==0.1.1",
    "requests>=2.31.0",
    "PyMuPDF>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
