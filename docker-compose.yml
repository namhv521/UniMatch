services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unimatch}
      POSTGRES_USER: ${POSTGRES_USER:-unimatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  portal:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "backend.app.container:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-access-log"]
    ports:
      - "127.0.0.1:${KLTN_WEB_PORT:-8767}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-unimatch}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-unimatch}
      UNIMATCH_DEPLOYMENT: ${UNIMATCH_DEPLOYMENT:-local}
      UNIMATCH_PUBLIC_ORIGIN: ${UNIMATCH_PUBLIC_ORIGIN:-http://127.0.0.1:8767}
      UNIMATCH_THESIS_SEMESTER: ${UNIMATCH_THESIS_SEMESTER:-2026.1}
      UNIMATCH_ROLE_ROSTER: ${UNIMATCH_ROLE_ROSTER:-{}}
      UNIMATCH_EMAIL_ACCOUNT_SEED: ${UNIMATCH_EMAIL_ACCOUNT_SEED:-[]}
      UNIMATCH_MODEL_BUNDLE: ${UNIMATCH_MODEL_BUNDLE:-}
      UNIMATCH_MODEL_BUNDLE_SHA256: ${UNIMATCH_MODEL_BUNDLE_SHA256:-}
      UNIMATCH_OPENROUTER_API_KEY: ${UNIMATCH_OPENROUTER_API_KEY:-}
    volumes:
      - type: bind
        source: ./outputs
        target: /app/outputs
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
