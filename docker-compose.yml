services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KLTN_ALLOW_PARTIAL: "${KLTN_ALLOW_PARTIAL:-0}"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./outputs
        target: /app/outputs
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
