      <stop offset="0%" stop-color="#116ee8"/>
      <stop offset="100%" stop-color="#073478"/>
    </linearGradient>
    <clipPath id="globe-clip">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

