  <path d="M9.9 36.7A22.6 22.6 0 0 0 28.85 54.38" stroke="#fbbf24" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M54.1 36.7A22.6 22.6 0 0 1 35.15 54.38" stroke="#fbbf24" stroke-width="2.3" stroke-linecap="round"/>

