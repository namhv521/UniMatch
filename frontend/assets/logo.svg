  <polygon points="32,12.2 44.2,17.9 32,23.6 19.8,17.9" fill="#fcd34d"/>
  <path d="M25.4 20.9V24.1C25.4 25.7 28.3 26.9 32 26.9C35.7 26.9 38.6 25.7 38.6 24.1V20.9L32 24L25.4 20.9Z" fill="#fde68a"/>
