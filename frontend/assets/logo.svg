    <line x1="32" y1="6" x2="32" y2="58"/>
    <ellipse cx="32" cy="32" rx="12.5" ry="25.5"/>
    <path d="M6.5 25.2Q32 29.8 57.5 25.2"/>
    <path d="M6.5 39.2Q32 35.2 57.5 39.2"/>
